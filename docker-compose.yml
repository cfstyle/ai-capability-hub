version: "3.9"

services:
  hub-core:
    build:
      context: .
      dockerfile: hub-core/Dockerfile
    ports:
      - "${HUB_PORT:-8080}:8080"
    volumes:
      - hub-data:/app/data
      - hub-logs:/app/logs
      - ./services:/app/services
      - ./data/shared-packages:/shared-packages:ro
      - ./data/wheels:/wheels:ro
    environment:
      - HUB_ENV=${HUB_ENV:-development}
      - HUB_LOG_LEVEL=${HUB_LOG_LEVEL:-INFO}
      - HUB_ADMIN_API_KEY=${HUB_ADMIN_API_KEY:-dev-admin-key}
      - HUB_CREDENTIAL_ENCRYPTION_KEY=${HUB_CREDENTIAL_ENCRYPTION_KEY:-}
      - HUB_PUBLIC_MCP_URL=${HUB_PUBLIC_MCP_URL:-}
      - HUB_RGONE_JWT_SECRET=${HUB_RGONE_JWT_SECRET:-}
      - HUB_RGONE_JWT_ISSUER=${HUB_RGONE_JWT_ISSUER:-rgone}
      - HUB_MCP_JWT_SECRET=${HUB_MCP_JWT_SECRET:-}
      - HUB_HUB_JWT_ISSUER=${HUB_HUB_JWT_ISSUER:-${HUB_JWT_ISSUER:-ai-capability-hub}}
      - HUB_TRUST_RGONE_ADMIN_JWT=${HUB_TRUST_RGONE_ADMIN_JWT:-true}
      - HUB_INTERNAL_SERVICE_SECRET=${HUB_INTERNAL_SERVICE_SECRET:-}
      - TICM_ENDPOINT_URL=http://ticm-mcp:8081/mcp
      - SERVICES_DIR=/app/services
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      ticm-mcp:
        condition: service_healthy
      message-mcp:
        condition: service_healthy
    networks:
      - hub-internal
      - rgone-net
    restart: unless-stopped

  ticm-mcp:
    image: mcp-runner:latest
    working_dir: /app
    volumes:
      - ./services/ticm-mcp:/app:ro
      - ./data/shared-packages:/shared-packages:ro
      - ./data/wheels:/wheels:ro
    environment:
      - TICM_HOST=0.0.0.0
      - PYTHONDONTWRITEBYTECODE=1
    command: ["python", "server.py"]
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hub-internal
    restart: unless-stopped

  message-mcp:
    build:
      context: ./services/message-mcp
      dockerfile: Dockerfile
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hub-internal
    restart: unless-stopped

volumes:
  hub-data:
  hub-logs:

networks:
  hub-internal:
    driver: bridge
  rgone-net:
    external: true
    name: rgone-net
